# Job B3 (plan v7): B2 settings plus the two city poses kept by the city scan (results/world_check_city/report.md, job 43468):
# city pose 1 (7 map objects near the line at x 26 to 35 m) and city pose 4 (wall along y 10 m at 2 m, building at x 57 m).
# 8 poses, so seed to pose assignment differs from B2. Question: how many never-ask crashes are scenery, and does true
# depth still land (the 19% left area / lost in B2 is a controller question, not perception). DA2 first, then true depth:
#   sbatch --time=01:30:00 --export=ALL,PA_ENV=/scratch/dns5508/envs/pa,HF_HOME=/scratch/$USER/hf,CMD="python -m eval.sweep --config configs/sweeps/airsim_cone_headroom_city.yaml" hpc/airsim_job.sbatch
#   true depth: same line with CMD="... --set stack=true-depth --set out=results/sweeps/cone_headroom_city_true_depth"
# Pose entries use the same [x, y, yaw_deg, clear_m] form as B2.
starts: &starts
  - [-150.0, 50.0, 180.0, 140.0]   # old pose 1
  - [150.0, -150.0, 0.0, 80.0]     # old pose 4
  - [-50.0, 50.0, 270.0, 91.0]     # B
  - [-150.0, -150.0, 90.0, 76.0]   # new
  - [-150.0, 150.0, 0.0, 68.0]     # new
  - [150.0, 150.0, 270.0, 77.0]    # D: map objects in the mission area (city)
  - [50.0, -50.0, 270.0, 94.0]     # city 1 (world_check_city pose 1)
  - [-50.0, -150.0, 270.0, 120.0]  # city 4 (world_check_city pose 4)
backend: airsim
backend_kw: {configs: "${PP_SIM_CONFIGS}", scene_file: scene_cap_400.jsonc, starts: *starts}
stack: da2
judge: none
delay_s: 1.0
split: val
seeds: {file: configs/seeds.yaml, skip: 60, n: 100}
scenario:
  layout: cone
  n_obstacles: [3, 8]
  min_gap_m: 5.0
  p_in_path: 0.35
  alt_range_m: [1.8, 2.2]
  families: [pole_10cm_axis_y, wire_3cm_axis_z, wire_1cm_axis_z, box_1m_grey, box_1m_black, wall_white_featureless, glass_pane_alpha20, ball_20cm_red]
controller: {avoid_mode: choose}
loop: {t_max: 120.0}
policies:
  - {name: never, policy: never}
out: results/sweeps/cone_headroom_city
flight_logs: true
