# Job B2 (plan v7): never-ask headroom on cone courses with DS's settings (2026-11-25): 3 to 8 obstacles 5 m apart,
# p_in_path 0.35 (each obstacle on the flight line with probability 0.35, else 3 to 8 m beside it). The band moves from
# 35 to 40% to whatever this gives; estimate [UNVERIFIED] about 0.79 never-ask crashes with DA2, near the 80% kill switch.
# 100 val seeds (60 to 159; 0 to 59 stay for tuning the policy cuts), DA2, then the same again (noise floor), then true
# depth (controller check: should land almost always):
#   sbatch --time=01:30:00 --export=ALL,PA_ENV=/scratch/dns5508/envs/pa,HF_HOME=/scratch/$USER/hf,CMD="python -m eval.sweep --config configs/sweeps/airsim_cone_headroom.yaml" hpc/airsim_job.sbatch
#   rep:        same line with CMD="... --set out=results/sweeps/cone_headroom_rep"
#   true depth: same line with CMD="... --set stack=true-depth --set out=results/sweeps/cone_headroom_true_depth"
# Starts: the 5 open poses from the world checks (job 43339, results/world_check/report.md: 0, 1, 3, 4, 5) plus pose D
# (2 there), which has map trees/structures inside the mission area at flying height (natural obstacles, DS decision
# 2026-11-25: map scenery stays and counts). Street poses from the city scan get added after it.
starts: &starts
  - [-150.0, 50.0, 180.0, 140.0]   # old pose 1
  - [150.0, -150.0, 0.0, 80.0]     # old pose 4
  - [-50.0, 50.0, 270.0, 91.0]     # B
  - [-150.0, -150.0, 90.0, 76.0]   # new
  - [-150.0, 150.0, 0.0, 68.0]     # new
  - [150.0, 150.0, 270.0, 77.0]    # D: map objects in the mission area (city)
backend: airsim
backend_kw: {configs: "${PP_SIM_CONFIGS}", scene_file: scene_cap_400.jsonc, starts: *starts}
stack: da2
judge: none
delay_s: 1.0
split: val
seeds: {file: configs/seeds.yaml, skip: 60, n: 100}
scenario:
  layout: cone
  n_obstacles: [3, 8]
  min_gap_m: 5.0
  p_in_path: 0.35
  alt_range_m: [1.8, 2.2]
  families: [pole_10cm_axis_y, wire_3cm_axis_z, wire_1cm_axis_z, box_1m_grey, box_1m_black, wall_white_featureless, glass_pane_alpha20, ball_20cm_red]
controller: {avoid_mode: choose}
loop: {t_max: 120.0}
policies:
  - {name: never, policy: never}
out: results/sweeps/cone_headroom
flight_logs: true
