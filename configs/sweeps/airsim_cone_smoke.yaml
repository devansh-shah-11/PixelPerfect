# Job B1 (plan v7): behaviour smoke of cone courses on Project AirSim, before the headroom grid. 20 val seeds (60 to 79).
# true-depth: should land in almost every flight (a crash is a controller or course bug); never with Depth Anything V2;
# always with the SURROGATE VLM and a placeholder direction accuracy (p_dir 0.8, unmeasured). Development only.
# Starts: the 5 poses chosen from the world checks (job 43339, results/world_check/report.md): 0, 1, 3, 4, 5; pose 2 (D) dropped.
#   sbatch --time=01:30:00 --export=ALL,PA_ENV=/scratch/dns5508/envs/pa,HF_HOME=/scratch/$USER/hf,CMD="python -m eval.sweep --config configs/sweeps/airsim_cone_smoke.yaml" hpc/airsim_job.sbatch
#   true depth (same seeds, own folder): add --set stack=true-depth --set out=results/sweeps/cone_smoke_true_depth to CMD
starts: &starts
  - [-150.0, 50.0, 180.0, 140.0]   # old pose 1
  - [150.0, -150.0, 0.0, 80.0]     # old pose 4
  - [-50.0, 50.0, 270.0, 91.0]     # B
  - [-150.0, -150.0, 90.0, 76.0]   # new
  - [-150.0, 150.0, 0.0, 68.0]     # new
backend: airsim
backend_kw: {configs: "${PP_SIM_CONFIGS}", scene_file: scene_cap_400.jsonc, starts: *starts}
stack: da2
judge: surrogate
judge_kw: {default_tpr: 0.80, default_fpr: 0.14, seed: 0, p_dir: 0.8}
delay_s: 1.0
split: val
seeds: {file: configs/seeds.yaml, skip: 60, n: 20}
scenario: &scenario
  layout: cone
  n_obstacles: [1, 5]
  p_in_path: 0.22
  alt_range_m: [1.8, 2.2]
  families: [pole_10cm_axis_y, wire_3cm_axis_z, wire_1cm_axis_z, box_1m_grey, box_1m_black, wall_white_featureless, glass_pane_alpha20, ball_20cm_red]
controller: {avoid_mode: choose}
loop: {t_max: 120.0}
policies:
  - {name: never, policy: never}
  - {name: always, policy: always, cooldown_s: 1.0}
out: results/sweeps/cone_smoke
flight_logs: true
