# Real-VLM version of airsim_replay_gates.yaml: the same flights with Qwen3-VL-8B answering instead of the surrogate.
# Asks whether the gates' lead over random and the tuned threshold survives real answers, whose errors are tied to
# the scene (the surrogate's are independent draws). The gates were trained on SURROGATE replay labels, so this is
# not the final Headline 1 test (that needs replay with real answers, M6.2), and the scenario is not frozen (M4.7).
# Judge: prompt "cross", both images, cut -4.02 = the 8B's val cut (results/benchmark.md). Taus as in the surrogate sweep.
# Smoke run first (2 seeds per policy, own folder), then the full run; resumable per (policy, seed):
#   sbatch --time=00:45:00 --export=ALL,PA_ENV=/scratch/dns5508/envs/pa,HF_HOME=/scratch/$USER/hf,CMD="python -m eval.sweep --config configs/sweeps/airsim_replay_gates_qwen.yaml --set seeds.n=2 --set out=results/sweeps/replay_gates_qwen_smoke" hpc/airsim_job.sbatch
#   sbatch --time=06:00:00 --export=ALL,PA_ENV=/scratch/dns5508/envs/pa,HF_HOME=/scratch/$USER/hf,CMD="python -m eval.sweep --config configs/sweeps/airsim_replay_gates_qwen.yaml" hpc/airsim_job.sbatch
starts: &starts
  - [150.0, 150.0, 0.0, 145.0]
  - [-150.0, 50.0, 180.0, 140.0]
  - [50.0, -150.0, 90.0, 120.0]
  - [-50.0, -150.0, 270.0, 120.0]
  - [150.0, -150.0, 0.0, 80.0]
backend: airsim
backend_kw: {configs: "${PP_SIM_CONFIGS}", scene_file: scene_cap_400.jsonc, starts: *starts}
stack: da2
judge: qwen
judge_kw: {model_id: Qwen/Qwen3-VL-8B-Instruct, prompt_key: cross, tau: -4.02}
delay_s: 1.0
split: val
seeds: {file: configs/seeds.yaml, n: 60}
scenario: {goal_m: 40.0, first_obstacle_m: [15.0, 25.0], n_obstacles: [1, 1], alt_range_m: [1.8, 2.2]}
loop: {t_max: 60.0}
policies:
  - {name: never, policy: never}
  - {name: gate_l3_q10, policy: gate, model_path: results/gate_replay/gate_l3_mlp.pkl, tau: 0.6011, cooldown_s: 1.0}
  - {name: gate_l1_q10, policy: gate, model_path: results/gate_replay/gate_l1_mlp.pkl, tau: 0.2884, cooldown_s: 1.0}
  - {name: random_p02, policy: random, p: 0.02, cooldown_s: 1.0}
  - {name: threshold_far_q10, policy: threshold, feature: corridor_min, tau: 37.9503, below: false, cooldown_s: 1.0}
  - {name: oracle, policy: oracle}
out: results/sweeps/replay_gates_qwen
flight_logs: true
