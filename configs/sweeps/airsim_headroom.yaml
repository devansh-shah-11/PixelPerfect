# M4.7 never-ask headroom: Depth Anything V2-Small on Project AirSim, no VLM, 100 val seeds. Target: crashes in 15 to 30% of flights.
# Outside that band, retune scenario difficulty on val before any policy comparison (PLAN_DETAILED.md D24, TASKS.md M4.7).
#   sbatch --time=01:30:00 --export=ALL,PA_ENV=/scratch/dns5508/envs/pa,CMD="python -m eval.sweep --config configs/sweeps/airsim_headroom.yaml" hpc/airsim_job.sbatch
# Resumable. Starts and scenario are copied from airsim_bench.yaml.
starts: &starts
  - [150.0, 150.0, 0.0, 145.0]
  - [-150.0, 50.0, 180.0, 140.0]
  - [50.0, -150.0, 90.0, 120.0]
  - [-50.0, -150.0, 270.0, 120.0]
  - [150.0, -150.0, 0.0, 80.0]
backend: airsim
backend_kw: {configs: "${PP_SIM_CONFIGS}", scene_file: scene_cap_400.jsonc, starts: *starts}
stack: da2
judge: none
delay_s: 1.0
split: val
seeds: {file: configs/seeds.yaml, n: 100}
scenario: {goal_m: 40.0, first_obstacle_m: [15.0, 25.0], n_obstacles: [1, 1], alt_range_m: [1.8, 2.2]}
loop: {t_max: 60.0}
policies:
  - {name: never, policy: never}
out: results/sweeps/headroom_da2_never
flight_logs: false
